[project]
name = "terra-prisca"
version = "0.1.0"
description = "Reconstructions and re-imaginings of simulations of the Precambrian and early Phanerozoic Earth system"
readme = "README.md"
license = "MIT"
authors = [{ name = "Barry W. Brook" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terra_prisca"]
